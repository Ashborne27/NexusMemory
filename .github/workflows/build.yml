name: Forge NexusMemory Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout du projet
      uses: actions/checkout@v4

    - name: Configuration OpenJDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Activation des permissions du wrapper Gradle
      run: chmod +x gradlew

    - name: Assemblage APK Release
      run: ./gradlew :app:assembleRelease --no-daemon -x lint -x test

    - name: Exportation de l'APK
      uses: actions/upload-artifact@v4
      with:
        name: NexusMemory-v6.8-Alpha
        path: app/build/outputs/apk/release/*.apk
