name: Build NexusMemory APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dependencies & Build Web Assets
      run: |
        npm install
        npx cap sync android

    - name: Sanitize Gradle Properties for CI
      run: |
        # Supprime la référence locale Termux pour forcer l'utilisation du AAPT2 standard de Maven
        sed -i '/aapt2FromMavenOverride/d' android/gradle.properties

    - name: Build Android APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NexusMemory-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
