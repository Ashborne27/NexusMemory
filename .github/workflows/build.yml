name: Forge NexusMemory Release APK

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
    - name: Enregistrement du code source
      uses: actions/checkout@v4

    - name: Configuration de l'environnement Java OpenJDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Attribution des droits d'exécution à Gradle
      run: chmod +x gradlew

    - name: Assemblage de l'APK Release (StrongBox / TEE)
      run: ./gradlew :app:assembleRelease --no-daemon

    - name: Publication de l'artefact APK
      uses: actions/upload-artifact@v4
      with:
        name: NexusMemory-v6.8-Alpha
        path: app/build/outputs/apk/release/*.apk
