name: Build NexusMemory Native APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Gradle Manually
      run: |
        GRADLE_VERSION=8.5
        wget -q https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip
        unzip -q gradle-${GRADLE_VERSION}-bin.zip
        sudo mv gradle-${GRADLE_VERSION} /opt/gradle
        echo "/opt/gradle/bin" >> $GITHUB_PATH

    - name: Configure Complete Android Project
      run: |
        cat << 'EOL' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "NexusMemory"
        include ':app'
        EOL

        cat << 'EOL' > build.gradle
        plugins {
            id 'com.android.application' version '8.2.0' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
        }
        EOL

        cat << 'EOL' > gradle.properties
        android.useAndroidX=true
        org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8
        EOL

        mkdir -p app/src/main/res/values
        cat << 'EOL' > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">NexusMemory</string>
        </resources>
        EOL

        cat << 'EOL' > app/src/main/res/values/themes.xml
        <resources>
            <style name="Theme.NexusMemory" parent="Theme.AppCompat.Light.NoActionBar" />
        </resources>
        EOL

        mkdir -p app/src/main/res/layout
        cat << 'EOL' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:background="#121212">

            <TextView
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:layout_gravity="center"
                android:text="NexusMemory Active"
                android:textColor="#FFFFFF"
                android:textSize="18sp" />
        </FrameLayout>
        EOL

        mkdir -p app
        cat << 'EOL' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }

        android {
            namespace 'com.ashborne.nexusmemory'
            compileSdk 34

            defaultConfig {
                applicationId "com.ashborne.nexusmemory"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }

            kotlinOptions {
                jvmTarget = '17'
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOL

        cat << 'EOL' > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
                android:allowBackup="true"
                android:label="@string/app_name"
                android:supportsRtl="true"
                android:theme="@style/Theme.NexusMemory">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOL

        mkdir -p app/src/main/java/com/ashborne/nexusmemory
        cat << 'EOL' > app/src/main/java/com/ashborne/nexusmemory/MainActivity.kt
        package com.ashborne.nexusmemory

        import android.os.Bundle
        import androidx.appcompat.app.AppCompatActivity

        class MainActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_main)
            }
        }
        EOL

    - name: Build Debug APK with Full Diagnostics
      run: gradle assembleDebug --stacktrace --info

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NexusMemory-Native-APK
        path: app/build/outputs/apk/debug/app-debug.apk
