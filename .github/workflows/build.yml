name: Forge NexusMemory Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      - name: Configuration de Java OpenJDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Attribution des droits d'exécution
        run: chmod +x gradlew

      - name: Compilation de l'APK Release
        run: ./gradlew :app:assembleRelease --no-daemon -x lint -x test

      - name: Exportation de l'artefact APK
        uses: actions/upload-artifact@v4
        with:
          name: NexusMemory-v6.8-Alpha
          path: app/build/outputs/apk/release/*.apk
