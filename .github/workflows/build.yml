name: Build NexusMemory Native APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Required SDK Packages
      run: |
        yes | sdkmanager --licenses || true
        sdkmanager "platforms;android-34" "build-tools;34.0.0"

    - name: Install Gradle Manually
      run: |
        GRADLE_VERSION=8.5
        wget -q https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip
        unzip -q gradle-${GRADLE_VERSION}-bin.zip
        sudo mv gradle-${GRADLE_VERSION} /opt/gradle
        echo "/opt/gradle/bin" >> $GITHUB_PATH

    - name: Configure Project Structure
      run: |
        cat << 'EOL' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "NexusMemory"
        include ':app'
        EOL

        cat << 'EOL' > build.gradle
        plugins {
            id 'com.android.application' version '8.2.0' apply false
        }
        EOL

        mkdir -p app
        cat << 'EOL' > app/build.gradle
        plugins {
            id 'com.android.application'
        }

        android {
            namespace 'com.ashborne.nexusmemory'
            compileSdk 34

            defaultConfig {
                applicationId "com.ashborne.nexusmemory"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
        EOL

        mkdir -p app/src/main
        cat << 'EOL' > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
                android:allowBackup="true"
                android:label="NexusMemory"
                android:supportsRtl="true"
                android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOL

        mkdir -p app/src/main/java/com/ashborne/nexusmemory
        cat << 'EOL' > app/src/main/java/com/ashborne/nexusmemory/MainActivity.kt
        package com.ashborne.nexusmemory

        import android.app.Activity
        import android.os.Bundle

        class MainActivity : Activity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
            }
        }
        EOL

    - name: Build Debug APK
      run: gradle assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NexusMemory-Native-APK
        path: app/build/outputs/apk/debug/app-debug.apk
