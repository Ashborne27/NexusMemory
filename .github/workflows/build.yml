name: Build NexusMemory Native APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Gradle Manually
      run: |
        GRADLE_VERSION=8.5
        wget -q https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip
        unzip -q gradle-${GRADLE_VERSION}-bin.zip
        sudo mv gradle-${GRADLE_VERSION} /opt/gradle
        echo "/opt/gradle/bin" >> $GITHUB_PATH

    - name: Configure Project Structure
      run: |
        cat << 'EOL' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "NexusMemory"
        include ':app'
        EOL

        cat << 'EOL' > build.gradle
        // Root project
        EOL

    - name: Build Debug APK with Stacktrace
      run: gradle assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NexusMemory-Native-APK
        path: app/build/outputs/apk/debug/app-debug.apk
