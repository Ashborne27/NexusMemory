name: Forge NexusMemory Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout du code source
      uses: actions/checkout@v4

    - name: Configuration de Java OpenJDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configuration de Gradle et du SDK Android
      uses: gradle/actions/setup-gradle@v3

    - name: Attribution des permissions d'exécution au wrapper Gradle
      run: chmod +x gradlew

    - name: Assemblage de l'APK Release
      run: ./gradlew :app:assembleRelease --no-daemon -x lint -x test

    - name: Publication de l'artefact APK
      uses: actions/upload-artifact@v4
      with:
        name: NexusMemory-v6.8-Alpha
        path: app/build/outputs/apk/release/*.apk
