<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusMemory</title>
    <style>
        body { 
            background: #0f172a; 
            color: #38bdf8; 
            font-family: monospace; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            padding: 20px; 
            box-sizing: border-box; 
        }
        .card { 
            background: #1e293b; 
            border: 1px solid #334155; 
            padding: 24px; 
            border-radius: 12px; 
            max-width: 400px; 
            width: 100%; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); 
        }
        h1 { 
            font-size: 1.5rem; 
            margin-top: 0; 
            color: #f8fafc; 
        }
        .status { 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            margin-top: 16px; 
            font-weight: bold; 
            color: #4ade80; 
        }
        .dot { 
            width: 10px; 
            height: 10px; 
            background: #4ade80; 
            border-radius: 50%; 
            box-shadow: 0 0 8px #4ade80; 
            animation: pulse 2s infinite; 
        }
        @keyframes pulse { 
            0% { opacity: 1; } 
            50% { opacity: 0.4; } 
            100% { opacity: 1; } 
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>NexusMemory</h1>
        <p>Noyau de virtualisation et persistance souveraine actif.</p>
        <div class="status">
            <div class="dot"></div>
            <span>Service Foreground Actif</span>
        </div>
    </div>
</body>
</html>
